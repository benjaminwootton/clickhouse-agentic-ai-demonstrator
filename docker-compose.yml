services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PROVIDER_1_NAME=${PROVIDER_1_NAME}
      - PROVIDER_1_API_KEY=${PROVIDER_1_API_KEY}
      - PROVIDER_1_BASE_URL=${PROVIDER_1_BASE_URL}
      - PROVIDER_1_MODEL=${PROVIDER_1_MODEL}
      - PROVIDER_2_NAME=${PROVIDER_2_NAME}
      - PROVIDER_2_API_KEY=${PROVIDER_2_API_KEY}
      - PROVIDER_2_BASE_URL=${PROVIDER_2_BASE_URL}
      - PROVIDER_2_MODEL=${PROVIDER_2_MODEL}
      - PROVIDER_3_NAME=${PROVIDER_3_NAME}
      - PROVIDER_3_API_KEY=${PROVIDER_3_API_KEY}
      - PROVIDER_3_BASE_URL=${PROVIDER_3_BASE_URL}
      - PROVIDER_3_MODEL=${PROVIDER_3_MODEL}
      - PROVIDER_4_NAME=${PROVIDER_4_NAME}
      - PROVIDER_4_API_KEY=${PROVIDER_4_API_KEY}
      - PROVIDER_4_BASE_URL=${PROVIDER_4_BASE_URL}
      - PROVIDER_4_MODEL=${PROVIDER_4_MODEL}
      - PROVIDER_5_NAME=${PROVIDER_5_NAME}
      - PROVIDER_5_API_KEY=${PROVIDER_5_API_KEY}
      - PROVIDER_5_BASE_URL=${PROVIDER_5_BASE_URL}
      - PROVIDER_5_MODEL=${PROVIDER_5_MODEL}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://78.47.43.63:3000}
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    restart: unless-stopped
